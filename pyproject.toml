[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diffsim"
version = "0.1.0"
description = "Fully differentiable, GPU-accelerated articulated-body simulation for humanoids"
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]

[tool.setuptools.packages.find]
include = ["diffsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
